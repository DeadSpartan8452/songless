  <circle cx="100" cy="100" r="48" fill="none" stroke="#27272a" stroke-width="1"/>
  <circle cx="100" cy="100" r="36" fill="none" stroke="#27272a" stroke-width="1"/>
  <circle cx="100" cy="100" r="16" fill="#a855f7" opacity="0.85"/>
