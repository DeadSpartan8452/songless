<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Pastille sombre, dans le ton du jeu -->
  <rect width="64" height="64" rx="14" fill="#111115"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.5" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- Onde sonore : les six paliers d'écoute de Songless -->
