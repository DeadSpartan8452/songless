    <line x1="14" y1="30" x2="14" y2="34"/>
    <line x1="23" y1="25" x2="23" y2="39"/>
    <line x1="32" y1="17" x2="32" y2="47"/>
    <line x1="41" y1="22" x2="41" y2="42"/>
    <line x1="50" y1="28" x2="50" y2="36"/>
  </g>
</svg>
